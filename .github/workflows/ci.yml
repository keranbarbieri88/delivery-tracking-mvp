name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Validação do Backend (Java 21 / Spring Boot)
  backend-check:
    name: Backend Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Executar Testes e Build do Spring Boot
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw clean test

  # Validação do Frontend (React + TypeScript + Vite)
  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Dependências
        run: |
          cd frontend
          npm ci

      - name: Validar Linting e TypeScript
        run: |
          cd frontend
          npm run lint

      - name: Executar Build do Frontend
        run: |
          cd frontend
          npm run build
