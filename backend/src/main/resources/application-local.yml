server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: delivery-tracking-api

  # Conexão padrão local: PostgreSQL (via Docker Compose na porta 5432)
  # Para rodar com H2 em modo arquivo sem Docker, defina DB_URL, DB_DRIVER, DB_USER e DB_PASSWORD ou ative o perfil 'h2'
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/delivery_db}
    username: ${DB_USER:delivery_user}
    password: ${DB_PASSWORD:delivery_pass}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

---
# Sub-perfil opcional para execução local com H2 em modo arquivo (spring.profiles.active=local,h2)
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:file:./data/delivery_db;AUTO_SERVER=TRUE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

